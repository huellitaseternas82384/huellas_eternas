<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Huellitas Eternas: un espacio para conservar recuerdos,
        honrar el vínculo con nuestras mascotas y presentar nuestros
        llaveros QR."
    >

    <meta
        name="author"
        content="Huellitas Eternas"
    >

    <meta
        name="theme-color"
        content="#f7e8e4"
    >

    <title>
        Huellitas Eternas
    </title>


    <!-- ICONOS -->

    <link
        rel="icon"
        type="image/x-icon"
        href="0101-0000-0100-1101/003/images/favicon.svg">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="0101-0000-0100-1101/001/css/s.css"
    >

    <link
        rel="stylesheet"
        href="0101-0000-0100-1101/001/css/c.css"
    >

    <link
        rel="stylesheet"
        href="0101-0000-0100-1101/001/css/b.css"
    >

    <link
        rel="stylesheet"
        href="0101-0000-0100-1101/001/css/a.css"
    >

    <link
        rel="stylesheet"
        href="0101-0000-0100-1101/001/css/sc.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header
        class="site-header"
        id="inicio"
    >

        <div class="container header-container">


            <!-- ==================== MARCA ==================== -->

            <a
                class="brand"
                aria-label="Huellitas Eternas - Inicio"
                data-animation="fade-right"
            >

                <span
                    class="brand-icon"
                    aria-hidden="true"
                >
                    <img
                        src="0101-0000-0100-1101/003/images/icon.png"
                        alt="logo"
                    >
                </span>


                <span class="brand-text">

                    <span class="brand-name">
                        Huellitas
                    </span>

                    <span class="brand-subtitle">
                        Eternas
                    </span>

                </span>

            </a>


            <!-- ==================== NAVEGACIÓN ==================== -->

            <nav
                class="main-navigation"
                id="main-navigation"
                aria-label="Navegación principal"
            >

                <ul class="navigation-list">

            </nav>


            <!-- ==================== MENÚ MÓVIL ==================== -->

            <button
                type="button"
                class="menu-button"
                id="menu-button"
                aria-label="Abrir menú"
                aria-expanded="false"
                aria-controls="main-navigation"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


        </div>

    </header>



        <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main id="contenido-principal">


        <!-- ==================================================
             HERO
             ================================================== -->

        <section
            class="page-hero-section"
            aria-labelledby="page-title"
        >

            <div class="container page-hero-container">


                <div
                    class="page-hero-content"
                    data-animation="fade-left"
                >


                    <p
                        class="hero-eyebrow"
                        data-animation="fade-down"
                    >
                        Cargando Recursos...
                    </p>


                    <h1
                        id="page-title"
                        class="hero-title"
                        data-animation="fade"
                        data-delay="100"
                    >
                        HUELLITAS ETERNAS
                    </h1>


                    <p
                        class="hero-description"
                        data-animation="fade-up"
                        data-delay="200"
                    >
                        Huellitas Eternas Tu bienestar emocional nos inporta, visitanos 😸.
                    </p>


                </div>

                <div
                    class="page-hero-media"
                    data-animation="fade-right"
                    data-delay="200"
                >

                    <img
                        src="0101-0000-0100-1101/003/images/icon.png"
                        alt="happy-dog"
                        class="page-hero-image"
                    >

                </div>

                </div>

    </main>

    <!-- JavaScript de carga -->
    <script src="0101-0000-0100-1101/002/js/c.js"></script>

    <script src="0101-0000-0100-1101/002/js/s.js"></script>

    <script src="0101-0000-0100-1101/002/js/a.js"></script>

    <script src="0101-0000-0100-1101/002/js/sc.js"></script>

</body>
</html>
